name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The real typecheck — next.config.mjs sets typescript.ignoreBuildErrors: true,
      # so `next build` alone would not catch type errors.
      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking: the repo currently has pre-existing lint errors unrelated to any
      # given PR. Remove continue-on-error once those are cleaned up and this should gate merges.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
